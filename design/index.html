<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio — High-fidelity concepts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#F6F2EA;--surface:#FFFDF8;--surface2:#EFE9DC;--border:#E2D9C8;--text:#1F1B16;--muted:#6F675B;
  --accent:#2F5D50;--accent-soft:#DCE9E3;--on-accent:#fff;--brass:#B5832A;--danger:#B3402F;--warn:#B7791F;--ok:#3C7A4F;--info:#346C9C;
  --sh1:0 1px 2px rgba(40,30,10,.08);--sh2:0 6px 20px rgba(40,30,10,.12);--sh3:0 14px 40px rgba(40,30,10,.2);
  --c-gray:#E8E3D9;--t-gray:#5B554A;--c-green:#D5E8D9;--t-green:#2C5E3A;--c-blue:#D6E4F2;--t-blue:#2A5A86;--c-orange:#F6E0C8;--t-orange:#8A5214;
  --c-red:#F3D6CF;--t-red:#8E2F20;--c-purple:#E3DAF0;--t-purple:#5B3F86;--c-yellow:#F5EBBF;--t-yellow:#7A6210;--c-teal:#CFE7E5;--t-teal:#1F5E5A;--c-pink:#F3D9E4;--t-pink:#85335A;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme=dark]{
  --bg:#14120F;--surface:#1C1A16;--surface2:#25221C;--border:#2F2B24;--text:#F1EBDD;--muted:#A59C8A;
  --accent:#7CC1AC;--accent-soft:#23382F;--on-accent:#0F1F1A;--brass:#D9AC4F;--danger:#E58A78;--warn:#E0B060;--ok:#7CC593;--info:#7FB3E0;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 6px 20px rgba(0,0,0,.5);--sh3:0 14px 40px rgba(0,0,0,.65);
  --c-gray:#34302A;--t-gray:#C9C1B1;--c-green:#233A29;--t-green:#9AD6AB;--c-blue:#1F3346;--t-blue:#9CC6EE;--c-orange:#4A3320;--t-orange:#F0BE88;
  --c-red:#4A2822;--t-red:#F0A596;--c-purple:#33294A;--t-purple:#C8B0F0;--c-yellow:#463E1A;--t-yellow:#EBD88A;--c-teal:#1D3A38;--t-teal:#8FD3CD;--c-pink:#48283A;--t-pink:#EFA9C8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/20px var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.tabsbar{position:sticky;top:0;z-index:50;display:flex;gap:4px;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow:auto}
.tabsbar b{font-family:var(--serif);font-size:18px;margin-right:12px;white-space:nowrap}
.tab{border:0;background:none;padding:6px 12px;border-radius:999px;white-space:nowrap;color:var(--muted)}
.tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:3px 8px;font-size:12px}
.screen{display:none}.screen.on{display:block}
/* app frame */
.app{display:grid;grid-template-columns:232px 1fr;height:calc(100vh - 49px);min-height:720px;background:var(--bg)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{font-family:var(--serif);font-size:22px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
.logo{width:24px;height:24px;border-radius:6px;background:var(--accent);position:relative}
.logo:after{content:"";position:absolute;left:6px;top:5px;width:12px;height:14px;border:2px solid var(--on-accent);border-radius:1px 4px 4px 1px;border-left-width:4px}
.nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted);border:0;background:none;text-align:left}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .i{width:18px;text-align:center}
.sidesec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.sub{padding:5px 10px 5px 38px;color:var(--muted);font-size:13px;border-radius:6px}
.sub.on{color:var(--text);background:var(--surface2)}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--border)}
.search{flex:1;max-width:480px;display:flex;gap:8px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 12px;color:var(--muted)}
.kbd{font:11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--border);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.content{padding:24px;overflow:auto;flex:1}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.pagehead h1{font-size:32px;line-height:40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--sh1)}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{font:12px var(--sans);color:var(--muted);margin-left:auto}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c7{grid-column:span 7}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}
.cb{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;flex:none;display:grid;place-items:center;font-size:11px;line-height:1}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-gray{background:var(--c-gray);color:var(--t-gray)}.p-green{background:var(--c-green);color:var(--t-green)}.p-blue{background:var(--c-blue);color:var(--t-blue)}.p-orange{background:var(--c-orange);color:var(--t-orange)}.p-red{background:var(--c-red);color:var(--t-red)}.p-purple{background:var(--c-purple);color:var(--t-purple)}.p-yellow{background:var(--c-yellow);color:var(--t-yellow)}.p-teal{background:var(--c-teal);color:var(--t-teal)}.p-pink{background:var(--c-pink);color:var(--t-pink)}
.ring{--p:60;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px}
.chart{display:flex;align-items:flex-end;gap:8px;height:96px}
.chart div{flex:1;background:var(--accent-soft);border-radius:4px 4px 0 0;position:relative}.chart div.t{background:var(--accent)}
.chart span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
/* bookshelf */
.shelfwrap{display:flex;flex-direction:column;gap:34px}
.shelf h3{font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.shelf h3 small{font:12px var(--sans);color:var(--muted)}
.books{display:flex;align-items:flex-end;gap:3px;padding:0 18px;min-height:190px;position:relative;border-bottom:10px solid var(--surface2);box-shadow:0 14px 14px -12px rgba(40,30,10,.25)}
[data-theme=dark] .books{box-shadow:0 14px 14px -12px #000}
.book{position:relative;border-radius:2px 3px 3px 2px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;box-shadow:inset 3px 0 0 rgba(255,255,255,.18),inset -2px 0 0 rgba(0,0,0,.2),2px 0 6px rgba(0,0,0,.18)}
.book span{writing-mode:vertical-rl;font:600 12px var(--serif);letter-spacing:.03em;white-space:nowrap;overflow:hidden;max-height:86%;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.book:before{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:rgba(255,255,255,.35)}
.book:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:rgba(255,255,255,.35)}
.book:hover{transform:translateY(-6px)}
.book.sel{transform:translateY(-14px) scale(1.04);box-shadow:var(--sh3);z-index:2;outline:2px solid var(--brass)}
.book .prog{position:absolute;left:0;bottom:0;width:100%;background:rgba(255,255,255,.55);height:3px}
.quick{position:absolute;z-index:3;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--sh3);color:var(--text)}
.cover{aspect-ratio:2/3;border-radius:3px 6px 6px 3px;color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--serif);box-shadow:var(--sh2),inset 4px 0 0 rgba(255,255,255,.16)}
.cover b{font-size:15px;line-height:19px}.cover small{font:11px var(--sans);opacity:.85}
.gridbooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;color:var(--muted)}.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* reader */
.reader{display:grid;grid-template-columns:168px 1fr 270px;height:100%;min-height:0}
.rtabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--border);background:var(--surface)}
.rtab{padding:7px 14px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:0;color:var(--muted);font-size:13px}.rtab.on{background:var(--bg);border-color:var(--border);color:var(--text);position:relative;top:1px}
.thumbs{border-right:1px solid var(--border);background:var(--surface);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.th{width:100px;height:130px;background:#fff;border:1px solid var(--border);border-radius:2px;box-shadow:var(--sh1);padding:10px 9px;position:relative}.th.on{outline:2px solid var(--accent)}
.th i{display:block;height:3px;background:#d8d2c4;margin-bottom:5px;border-radius:2px}.th em{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font:11px var(--sans);color:var(--muted);font-style:normal}
.canvas{background:var(--surface2);overflow:auto;padding:26px;display:flex;justify-content:center;position:relative}
.page{width:560px;min-height:740px;background:#FFFEFA;color:#1d1a15;box-shadow:var(--sh2);padding:56px 58px;font-family:Georgia,serif;font-size:14.5px;line-height:23px;position:relative}
.page h2{font-size:22px;margin-bottom:14px;color:#1d1a15}.page p{margin:0 0 12px;text-align:justify}
.hl{background:rgba(250,214,70,.55);border-radius:2px}.hl2{background:rgba(120,200,160,.45)}.ul{text-decoration:underline;text-decoration-color:#d4543c;text-decoration-thickness:2px;text-underline-offset:3px}.st{text-decoration:line-through;text-decoration-color:#555}
.sticky{position:absolute;right:-18px;top:150px;width:26px;height:26px;background:#F3C84B;border-radius:4px 4px 4px 0;box-shadow:var(--sh2);display:grid;place-items:center;font-size:13px;color:#4a3a05}
.floattool{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh2);z-index:5}
.floattool button{border:0;background:none;width:32px;height:32px;border-radius:8px;font-size:15px}.floattool button.on{background:var(--accent-soft);color:var(--accent)}
.floattool .sw{width:18px;height:18px;border-radius:50%;margin:7px 3px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.rpanel{border-left:1px solid var(--border);background:var(--surface);padding:14px;overflow:auto}
.ann{border:1px solid var(--border);border-left:4px solid #E8C23A;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.rfoot{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:99px;box-shadow:var(--sh2);font-size:12px}
/* tracker */
.tbar{display:flex;align-items:center;gap:6px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.vtab{padding:10px 12px;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}.vtab.on{color:var(--text);border-color:var(--accent);font-weight:600}
.tool{display:flex;gap:8px;align-items:center;padding:10px 24px}
.tablewrap{overflow:auto;padding:0 24px 24px;position:relative}
table.t{border-collapse:separate;border-spacing:0;min-width:1020px;width:100%;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.t th{background:var(--surface2);font-weight:500;color:var(--muted);text-align:left;padding:0 10px;height:34px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);position:relative;white-space:nowrap}
.t th .pi{display:inline-block;width:18px;color:var(--muted);font:11px var(--mono)}
.t th:after{content:"";position:absolute;right:-2px;top:6px;bottom:6px;width:4px;border-radius:2px;cursor:col-resize}.t th:hover:after{background:var(--accent)}
.t td{height:38px;padding:0 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
.t tr:last-child td{border-bottom:0}.t td.g,.t th.g{width:62px;min-width:62px;color:var(--muted);text-align:center;padding:0 6px;font-size:12px}
.t tr.sel td{background:var(--accent-soft)}.t tr:hover td{background:color-mix(in srgb,var(--surface2) 55%,transparent)}.t tr.sel:hover td{background:var(--accent-soft)}
.t td.fx{background:color-mix(in srgb,var(--surface2) 60%,transparent);font-family:var(--mono);font-size:12px}
.t td.active{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)!important;position:relative}
.editor{display:flex;align-items:center;gap:6px}.caret{display:inline-block;width:1.5px;height:16px;background:var(--accent);animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
.grip{cursor:grab;color:var(--muted);opacity:.0;margin-right:2px}tr:hover .grip{opacity:1}
.sumrow td{background:var(--surface2);color:var(--muted);font-size:12px}
.bulk{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--text);color:var(--bg);border-radius:12px;box-shadow:var(--sh3);z-index:4}
.bulk .btn{background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5)}
.menu{position:absolute;width:210px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh3);padding:6px;z-index:6;font-size:13px}
.menu div{padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between}.menu div:hover{background:var(--surface2)}.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}.menu .d{color:var(--danger)}
.split{display:grid;grid-template-columns:1fr 340px;min-height:0;flex:1;overflow:hidden}
.detail{border-left:1px solid var(--border);background:var(--surface);padding:18px;overflow:auto}
.detail h2{font-size:22px;margin-bottom:4px}
.prop{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:6px 0;align-items:center;font-size:13px}.prop .k{color:var(--muted);display:flex;gap:6px}
.kanban{display:flex;gap:14px;padding:6px 24px 24px;overflow:auto;align-items:flex-start}
.col{width:260px;flex:none;background:var(--surface2);border-radius:12px;padding:10px}.col h4{margin:2px 4px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--sh1);font-size:13px}.kc.drag{transform:rotate(2deg);box-shadow:var(--sh3)}
.kc .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);margin:0 24px 24px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal .h{padding:6px 10px;background:var(--surface2);color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
.cal .d{min-height:92px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;font-size:12px}.cal .d:nth-child(7n){border-right:0}.cal .d.o{color:var(--muted);background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.cal .d.today b{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 6px}
.ev{display:block;border-radius:4px;padding:1px 6px;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{margin:0 24px 24px;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:auto}
.tlhead{display:grid;grid-template-columns:220px repeat(12,1fr);background:var(--surface2);font-size:12px;color:var(--muted);position:sticky;top:0}.tlhead div{padding:7px 8px;border-right:1px solid var(--border)}
.tlrow{display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--border);height:40px;align-items:center}.tlrow>div:first-child{padding:0 12px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;gap:8px;font-size:13px}
.lane{position:relative;height:100%;background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 1px),var(--border) calc(100%/12 - 1px) calc(100%/12))}
.gb{position:absolute;top:9px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap}
.gb i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.22)}.gb span{position:relative}
.ms{position:absolute;top:12px;width:16px;height:16px;transform:rotate(45deg);background:var(--brass);border-radius:3px}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.7}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:6px 24px 24px}
.gc{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--sh1)}.gc .im{height:110px}.gc .bd{padding:10px 12px;font-size:13px}
/* modal */
.scrim{background:rgba(20,15,5,.35);position:relative;min-height:680px;display:grid;place-items:center;padding:30px;border-radius:14px;overflow:hidden}
.dlg{width:760px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh3);display:grid;grid-template-columns:260px 1fr}
.dlg .l{border-right:1px solid var(--border);padding:14px;max-height:620px;overflow:auto}.dlg .r{padding:18px;display:flex;flex-direction:column;gap:12px}
.tp{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}.tp.on{background:var(--accent-soft);color:var(--accent);font-weight:600}.tp .g{width:22px;height:22px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font:11px var(--mono);color:var(--muted)}
.inp{border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:7px 10px;width:100%}.inp.f{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.code{font:12.5px/20px var(--mono);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:6px}.sw{width:16px;height:16px;border-radius:50%;display:inline-block}
/* knowledge / planner / settings */
.three{display:grid;grid-template-columns:220px 1fr 280px;height:100%;min-height:0}

<div class="page" style="margin-top:56px"><h2>5. The Slow Page</h2>
<p>To read well is to <span class="hl">resist the pull of speed</span>. A page offers no notification, no counter of those who have read before us; it asks only that we stay, and in staying, we begin to think alongside the author.</p>
<p>The habit of <span class="ul">annotating a margin</span> is older than print. Medieval readers glossed their manuscripts with small drawings and arguments, turning each codex into a <span class="hl hl2">conversation across centuries</span>.</p>
