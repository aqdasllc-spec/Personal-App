# NOTE: written in the planning environment, which cannot run GitHub Actions.
# First real run may need small fixes; the commands themselves are the ones verified locally
# (see docs/DEVELOPMENT.md).
name: ci
on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  sync_engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/sync_engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - name: SQL tests (RLS, apply_changes)
        run: supabase/tests/run.sh
      - name: Differential test (Dart reference vs Postgres)
        working-directory: packages/sync_engine
        run: |
          dart pub get
          dart run tool/differential.dart 300

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter pub get
      - name: Generated code is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test
      # Exercises encrypted SQLite (sqlite3mc build hook) on every desktop OS.

  build_smoke:
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cmd: "flutter build apk --debug" }
          - { os: macos-latest, cmd: "flutter build ios --debug --no-codesign" }
          - { os: macos-latest, cmd: "flutter build macos --debug" }
          - { os: windows-latest, cmd: "flutter build windows --debug" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: contains(matrix.cmd, 'apk')
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
